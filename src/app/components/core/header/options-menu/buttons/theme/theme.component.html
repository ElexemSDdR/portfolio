<button
  [class]="
    tailwindMerge([
      currentTheme === theme() ? 'active' : '',
      'flex w-full flex-col items-center justify-center px-8 py-3 text-center text-sm sm:flex-row sm:justify-between sm:px-2 sm:py-4 sm:text-left sm:text-xl',
    ])
  "
  (click)="changeTheme(theme())"
  class="group"
>
  {{ themeName() }}
  <app-icons
    [name]="theme()"
    className="size-6 md:size-10 transition-transform group-hover:rotate-12 {{ className() }}"
  />
</button>
