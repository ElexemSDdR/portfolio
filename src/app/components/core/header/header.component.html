<header
  class="fixed top-0 right-0 left-0 z-999 bg-black/15 px-2 text-2xl text-white backdrop-blur-2xl backdrop-brightness-50"
>
  <nav class="relative flex size-full flex-row justify-between sm:items-center sm:justify-center">
    <button
      popovertarget="header-links"
      class="mx-4 cursor-pointer self-center rounded-full p-3 transition-shadow hover:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] active:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] sm:hidden"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        class="menu-icon peer-[:has(:popover-open)]:open size-10"
      >
        <path
          class="line l1"
          d="M4 6H20"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          class="line l2"
          d="M4 12H20"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          class="line l3"
          d="M4 18H20"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <div
      class="peer fixed mx-4 my-22 rounded-[20px] bg-[light-dark(var(--header-links-and-options-bg-color-light),var(--header-links-and-options-bg-color-dark))]/95 px-2 py-1 shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] transition-transform sm:relative sm:m-0 sm:flex sm:w-full sm:bg-transparent sm:shadow-none"
      popover
      id="header-links"
    >
      <ul
        class="flex h-full w-full flex-col flex-wrap justify-center text-white sm:visible sm:flex-row lg:justify-evenly [&>li]:my-1 [&>li]:sm:my-0 [&>li>a]:flex [&>li>a]:px-3 [&>li>a]:py-2 [&>li>a]:text-xl [&>li>a]:sm:py-3 [&>li>a]:lg:text-[26px] [&>li>a,button]:relative [&>li>a,button]:h-full [&>li>a,button]:w-full [&>li>a,button]:cursor-pointer [&>li>a,button]:rounded-full [&>li>a,button]:transition-shadow [&>li>a,button]:hover:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] [&>li>a,button]:active:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] [&>li>a,button]:sm:m-0 [&>li>a,button]:sm:px-8"
      >
        <li><a href="#about">Sobre mí</a></li>
        <li><a href="#projects">Proyectos</a></li>
        <li><a href="#experience">Experiencia</a></li>
        <li><a href="#contact">Contacto</a></li>
        <li class="mx-auto h-px w-11/12 rounded-full bg-gray-400 sm:hidden"></li>
        <li
          class="z-50 hidden self-center justify-self-center sm:flex md:justify-self-end"
          id="options-button"
        >
          <button class="my-0 py-2" popovertarget="options-menu">
            <app-icons name="options" className="size-8 md:size-10" />
          </button>
        </li>
        <li>
          <div
            popover="auto"
            id="options-menu"
            class="sm:text-md relative w-full max-w-xs flex-col gap-1 rounded-[20px] bg-[#19021c]/95 p-2 text-lg text-white not-sm:flex sm:fixed sm:mt-4 sm:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] sm:open:flex [&>button]:flex [&>button]:w-full [&>button]:items-center [&>button]:justify-between [&>button]:gap-6 [&>button]:px-2 [&>button]:py-4 [&>button]:sm:mx-3 [&>button>span]:transition-transform [&>button>span]:group-hover:rotate-12"
          >
            <button id="change-translation" class="group">
              Traducir
              <span>
                <app-icons name="translate" className="size-6 md:size-10"></app-icons>
              </span>
            </button>
            <button id="print-cv" class="group">
              Descargar CV
              <span>
                <app-icons name="print-cv" className="size-6 md:size-10"></app-icons>
              </span>
            </button>
            <button id="toggle-theme" class="group peer" popovertarget="themes">
              Cambiar tema
              <app-icons
                name="selector"
                className="size-4 md:size-8 rotate-90 transition-transform group-[:has(+_#themes:hover,+_#themes:popover-open)]:rotate-180"
              />
            </button>
            <div
              id="themes"
              popover
              class="fixed mx-5 my-8 w-full max-w-3xs flex-col rounded-[20px] bg-[#19021c]/95 px-2 py-2 text-white shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] open:flex sm:mx-3 sm:my-0 sm:gap-2 sm:px-3 md:max-w-2xs [&>button]:flex [&>button]:items-center [&>button]:justify-between [&>button]:px-4 [&>button]:py-4 [&>button]:text-left [&>button]:text-lg [&>button]:sm:px-2 [&>button]:sm:py-4"
            >
              <button (click)="changeTheme('system')">
                Ajuste del dispositivo
                <app-icons name="sistem-config-theme" className="size-6 md:size-10" />
              </button>
              <button (click)="changeTheme('dark')">
                Oscuro <app-icons name="moon" className="size-6 md:size-10" />
              </button>
              <button (click)="changeTheme('light')">
                Claro <app-icons name="sun" className="size-6 md:size-10" />
              </button>
            </div>
          </div>
        </li>
      </ul>
    </div>
    <span
      class="visible mx-4 flex self-center sm:hidden [&>a]:rounded-full [&>a]:p-4 [&>a]:transition-shadow [&>a]:hover:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset] [&>a]:active:shadow-[4px_6px_20px_black,2px_4px_15px_-10px_#cdcdcddf_inset]"
    >
      <button
        id="options"
        class="h-10 w-40 rounded-full px-4 py-2 [&>option]:rounded-full [&>option]:py-2 [&>option]:text-black"
      ></button>
    </span>
  </nav>
</header>
