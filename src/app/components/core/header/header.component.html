<header
  class="bg-header-and-footer/15 text-fg-links-header fixed top-0 right-0 left-0 z-999 px-2 text-2xl backdrop-blur-2xl backdrop-brightness-50"
>
  <nav class="relative flex size-full flex-row justify-between sm:items-center sm:justify-center">
    <button
      popovertarget="header-links"
      class="group hover:shadow-header-links active:shadow-header-links mx-4 cursor-pointer self-center rounded-full p-3 transition-shadow sm:hidden"
    >
      <svg
        fill="none"
        class="size-10 transform hover:cursor-pointer [&>path]:transition-[0.35s_cubic-bezier(0.4,0,0.2,1),opacity_0.25s_ease]"
        viewBox="0 0 24 24"
      >
        <path
          stroke="#fff"
          stroke-linecap="round"
          stroke-width="2"
          style="transform-origin: 12px 6px"
          d="M4 6h16"
          class="l1"
        />
        <path
          stroke="#fff"
          stroke-linecap="round"
          stroke-width="2"
          style="transform-origin: 12px 12px"
          d="M4 12h16"
          class="l2"
        />
        <path
          stroke="#fff"
          stroke-linecap="round"
          stroke-width="2"
          style="transform-origin: 12px 18px"
          d="M4 18h16"
          class="l3"
        />
      </svg>
    </button>
    <div
      class="peer bg-bg-links-header/95 rounded-header-links shadow-header-links fixed mx-2 my-18 w-full px-2 py-1 transition-transform not-sm:max-w-44 sm:relative sm:m-0 sm:flex sm:w-full sm:bg-transparent sm:shadow-none"
      popover
      id="header-links"
    >
      <ul
        class="text-fg-links-header [&>li>a,button]:hover:shadow-header-links [&>li>a,button]:active:shadow-header-links flex h-full w-full flex-col flex-wrap justify-center sm:visible sm:flex-row sm:justify-center sm:text-white md:justify-evenly [&>li]:my-1 [&>li]:sm:my-0 [&>li>a]:flex [&>li>a]:items-center [&>li>a]:px-3 [&>li>a]:py-2 [&>li>a]:text-base [&>li>a]:sm:py-3 [&>li>a]:lg:text-[26px] [&>li>a,button]:relative [&>li>a,button]:h-full [&>li>a,button]:w-full [&>li>a,button]:cursor-pointer [&>li>a,button]:rounded-full [&>li>a,button]:transition-shadow [&>li>a,button]:sm:m-0 [&>li>a,button]:sm:px-8"
      >
        <li><a href="/#about">Sobre mí</a></li>
        <li><a href="/#projects">Proyectos</a></li>
        <li><a href="/#experience">Experiencia</a></li>
        <li><a href="/#contact">Contacto</a></li>
        <li class="mx-auto h-px w-11/12 rounded-full bg-gray-400 sm:hidden"></li>
        <li
          class="group z-50 hidden self-center justify-self-center sm:flex md:justify-self-end"
          id="options-button"
        >
          <button class="my-0 py-2" id="options-btn" popovertarget="options-menu">
            <app-icons
              name="options"
              className="size-8 md:size-10 group-[:has(+_li>div:popover-open)]:rotate-45 transition-transform"
            />
          </button>
        </li>
        <li><app-options-menu /></li>
      </ul>
    </div>
  </nav>
</header>
