<ul class="flex flex-col">
  @for (experience of experiences(); track experience.jobName) {
    <li class="-mx-5 pl-8 xl:mx-64 xl:px-14 relative py-4" id="{{ doUnionLine($index) }}">
      <div class="flex flex-col gap-1">
        <h5 class="text-md xl:text-xl font-bold tracking-normal xl:tracking-wide">
          {{ experience.jobName }}
        </h5>
        <span class="text-[14px] xl:text-md font-light text-gray-300">{{ experience.date }}</span>
        <p class="text-xs font-medium tracking-wide text-pretty">{{ experience.jobPosition }}</p>
      </div>
    </li>
  }
</ul>
