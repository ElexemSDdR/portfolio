<app-section-container
  className="items-center justify-center gap-10 pt-30 2xl:pt-60 animate-range-[entry_25%_contain_40%]"
  id="projects"
  [title]="sectionTitle"
>
  <section class="grid grid-cols-1 gap-4 md:grid-cols-2">
    @for (project of projects(); track project.id) {
      <app-project-card
        [project]="project"
        [animateSide]="$index % 2 == 0 ? 'animate-fade-in-right' : 'animate-fade-in-left'"
      ></app-project-card>
    }
  </section>
</app-section-container>
